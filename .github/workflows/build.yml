name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer from GitHub
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y buildozer || true
          pip install --upgrade cython
          pip install git+https://github.com/kivy/buildozer.git

      - name: Show versions
        run: |
          buildozer --version
          pip show buildozer
          python --version

      - name: Clean cache
        run: |
          rm -rf ~/.buildozer

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
